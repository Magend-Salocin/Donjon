# Configuration DOSBox-X pour étudier HeroQuest (lancer avec lancer-dosbox.ps1, qui monte la copie de travail).
# Seules les différences avec la configuration par défaut de DOSBox-X sont indiquées.

[sdl]
output = opengl
# La souris est prise par la fenêtre au premier clic (Ctrl+F10 la relâche ou la reprend).
autolock = true

[dosbox]
title = HeroQuest 1991 - étude
machine = svga_s3
memsize = 4

[cpu]
# Cadence fixe : les mêmes actions donnent le même déroulement d'une session à l'autre.
core = normal
cycles = fixed 3000

[sblaster]
oplmode = opl2

[log]
# Journal de DOSBox-X dans travail/dosbox-x.log (chemin posé par le lanceur). Les journaux détaillés
# (int21, fileio) n'existent que dans les versions de DOSBox-X compilées pour le débogage.
# Le débogueur (Alt+Pause, ou la commande DEBUGBOX) s'ouvre arrêté sur l'instruction courante.
debuggerrun = debugger

[autoexec]
